name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release ancestry verification
        run: bash scripts/test-verify-release-on-main.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app

      - name: Install cargo-about
        shell: bash
        run: bash scripts/install-cargo-about.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check versions, types, lint, and client tests
        run: bun run check

      - name: Check Rust formatting
        working-directory: app
        run: cargo fmt --check

      - name: Clippy
        working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: app
        run: cargo test --locked

  # Windows 固有のコードとリソース埋め込みは Windows 上でしか確かめられない。
  # build.rs がアイコンと版情報を焼くのに、その OS のリソースコンパイラが要るため。
  #
  # 検査とリリースビルドは互いに待つ理由が無いので、2 つのジョブへ分けて同時に走らせる。
  # public リポジトリの標準ランナーは無料なので、実時間だけが縮む。
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app
          # Release の test ジョブと同じ鍵。どちらも dev プロファイルの成果物を積むので、
          # 一方が温めた target をもう一方がそのまま使える。
          shared-key: windows-check

      - name: Install cargo-about
        shell: bash
        run: bash scripts/install-cargo-about.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # rust-embed が exe へ焼くページを先に作る。ライセンスページは必須の入力なので、
      # ここでも本番と同じ手順で生成する (欠けたまま焼ける道を残さない)。
      - name: Generate embedded assets
        run: bun run prepare:assets

      # --all-targets を付けない。同じジョブの cargo test がテストをコンパイルするのに、
      # clippy は別のフィンガープリント空間で同じものをもう一度コンパイルしてしまう。
      # テストコードの lint は ubuntu 側が --all-targets で見ている。
      - name: Clippy
        working-directory: app
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: app
        run: cargo test --locked

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app
          # Release の build ジョブと同じ鍵。どちらも release プロファイルを積むので、
          # タグを打った側がここで温めた target をそのまま使える。
          shared-key: windows-build

      - name: Install cargo-about
        shell: bash
        run: bash scripts/install-cargo-about.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate embedded assets
        run: bun run prepare:assets

      - name: Build release executable
        working-directory: app
        run: cargo build --release --locked
